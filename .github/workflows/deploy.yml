name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets du dépôt (Settings → Secrets and variables → Actions).
      # Sans eux, le Worker n'est pas déployé et le site fonctionne en mode direct.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier le Worker
        run: npx tsc -p worker/tsconfig.json

      - name: Déployer le Worker (Cloudflare)
        id: worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          npx wrangler deploy --config worker/wrangler.jsonc 2>&1 | tee wrangler.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler.log | head -1)
          echo "Worker : ${url:-URL introuvable}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Clés d'API du Worker
        # Chaque source qui exige une clé reste inactive tant que son secret manque.
        if: steps.worker.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
          HARVARD_KEY: ${{ secrets.HARVARD_KEY }}
          SMITHSONIAN_KEY: ${{ secrets.SMITHSONIAN_KEY }}
        run: |
          node -e '
            const names = ["TMDB_TOKEN","TWITCH_CLIENT_ID","TWITCH_CLIENT_SECRET","EUROPEANA_KEY","HARVARD_KEY","SMITHSONIAN_KEY"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Clés présentes :", Object.keys(out).join(", ") || "aucune");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json --config worker/wrangler.jsonc; fi
          rm -f secrets.json

      - name: Construire le site
        run: npm run build
        env:
          # URL du Worker : celle du déploiement ci-dessus, sinon la variable API_URL du dépôt.
          VITE_API_URL: ${{ steps.worker.outputs.url || vars.API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
