name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets du dépôt (Settings → Secrets and variables → Actions).
      # Sans eux, le Worker n'est pas déployé et le site fonctionne en mode direct.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier le Worker
        run: npx tsc -p worker/tsconfig.json

      - name: Déployer le Worker (Cloudflare)
        id: worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          npx wrangler deploy --config worker/wrangler.jsonc 2>&1 | tee wrangler.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler.log | head -1)
          echo "Worker : ${url:-URL introuvable}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Construire le site
        run: npm run build
        env:
          # URL du Worker : celle du déploiement ci-dessus, sinon la variable API_URL du dépôt.
          VITE_API_URL: ${{ steps.worker.outputs.url || vars.API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
